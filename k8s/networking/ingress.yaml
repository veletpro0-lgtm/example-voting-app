apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: voting-app-ingress
  namespace: voting-app

spec:
  ingressClassName: nginx

  rules:
    - host: vote.voting.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote
                port:
                  number: 80

    - host: result.voting.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: 80
