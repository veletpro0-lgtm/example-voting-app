apiVersion: apps/v1
kind: Deployment

metadata:
  name: result
  namespace: voting-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: result

  template:
    metadata:
      labels:
        app: result

    spec:
      imagePullSecrets:
        - name: registry-secret

      containers:
        - name: result
          image: yamanradan/voting:result-v1
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: postgres-secret

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
